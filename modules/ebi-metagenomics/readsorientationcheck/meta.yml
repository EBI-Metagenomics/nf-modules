# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "readsorientationcheck"
description: |
  Check whether the R1 reads of a sample have mixed orientation (forward and reverse reads in the same file).
  The module takes the first N R1 reads with seqkit and searches them with cmsearch (--hmmonly --cut_ga).
  A Python script then counts the reads that match each strand.
  The sample is "mixed" when the forward percentage of the N requested reads is in the range 100 - cutoff to cutoff (inclusive).
  Use task.ext.args for extra cmsearch arguments (for example "-Z 1000") and task.ext.args2 for the script (for example "--cutoff-pct 60").
keywords:
  - amplicon
  - orientation
  - strand
  - qc
  - cmsearch
  - rfam
tools:
  - "seqkit":
      description: "Cross-platform and ultrafast toolkit for FASTA/Q file manipulation"
      homepage: "https://bioinf.shenwei.me/seqkit/"
      documentation: "https://bioinf.shenwei.me/seqkit/usage/"
      tool_dev_url: "https://github.com/shenwei356/seqkit"
      doi: "10.1371/journal.pone.0163962"
      licence: ["MIT"]
      identifier: biotools:seqkit
  - "infernal":
      description: "Infernal ('INFERence of RNA ALignment') is for searching DNA sequence databases for RNA structure and sequence similarities"
      homepage: "http://eddylab.org/infernal/"
      documentation: "http://eddylab.org/infernal/Userguide.pdf"
      tool_dev_url: "https://github.com/EddyRivasLab/infernal"
      doi: "10.1093/bioinformatics/btt509"
      licence: ["BSD-3-Clause"]
      identifier: biotools:infernal

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: |
          FASTQ file(s), plain or gzip. For paired-end data, give [R1, R2]; the module screens R1 only.
          Use the raw reads, before trimming, sorting or merging.
        pattern: "*.{fastq,fq,fastq.gz,fq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1930" # FASTQ
  - covariance_model:
      type: file
      description: Covariance model file for cmsearch (for example Rfam ribo.cm). All models must have gathering (GA) cutoffs.
      pattern: "*.cm"
      ontologies: []
  - n_reads:
      type: integer
      description: |
        Number of R1 reads to search (the first N reads in the file).
        This is also the denominator of the forward percentage, also when the file has fewer reads.
output:
  tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information e.g. `[ id:'sample1', single_end:false ]`
      - "*.orientation.tsv":
          type: file
          description: |
            TSV file with a header and one row. Columns: sample, cm_database, reads_requested, reads_tested,
            resolved, forward, reverse, no_hit, forward_pct_of_requested, cutoff_pct, classification
          pattern: "*.orientation.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  cmsearch_tbl:
    - - meta:
          type: map
          description: Groovy Map containing sample information e.g. `[ id:'sample1', single_end:false ]`
      - "*.cmsearch.tbl.gz":
          type: file
          description: cmsearch --tblout table for the searched reads. The target IDs are the read numbers (1 to N).
          pattern: "*.cmsearch.tbl.gz"
          ontologies: []
  classification:
    - - meta:
          type: map
          description: Groovy Map containing sample information e.g. `[ id:'sample1', single_end:false ]`
      - classification:
          type: string
          description: Sample-level call. One of "mixed", "not_mixed", "no_hits" or "no_resolved_hits"
  versions_infernal:
    - - "${task.process}":
          type: string
          description: The name of the process
      - infernal:
          type: string
          description: The name of the tool
      - "cmsearch -h | grep -o '^# INFERNAL [0-9.]*' | sed 's/^# INFERNAL *//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_seqkit:
    - - "${task.process}":
          type: string
          description: The name of the process
      - seqkit:
          type: string
          description: The name of the tool
      - "seqkit version | sed 's/^seqkit v//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - infernal:
          type: string
          description: The name of the tool
      - "cmsearch -h | grep -o '^# INFERNAL [0-9.]*' | sed 's/^# INFERNAL *//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - seqkit:
          type: string
          description: The name of the tool
      - "seqkit version | sed 's/^seqkit v//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
