---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "filterpaf"
description: Module that uses awk to filter alignments in a PAF file based on query coverage and percentage identity (PID).
keywords:
  - awk
  - paf
  - minimap2
  - alignment
  - filtering
tools:
  - awk:
      description: GNU Awk is a powerful text-processing language used to manipulate structured text files.
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      tool_dev_url: "https://github.com/onetrueawk/awk"
      licence: ["GPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - paf_file:
        type: file
        description: PAF file produced by minimap2 containing sequence alignment records.
        pattern: "*.paf"
output:
  - mapped_contigs_txt:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.txt":
          type: file
          description: Plain text file containing the IDs of query sequences that mapped the reference with high confidence and have to be filtered out.
          pattern: "*.txt"
  - mapped_contigs_tsv:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*_mapped.tsv.gz":
          type: file
          description: |
            Optional gzipped TSV listing the query sequences that mapped the reference
            with high confidence and have to be filtered out. Includes 3 columns: sequence ID,
            query coverage and identity. Only produced when at least one sequence passed the
            filtering thresholds.
          pattern: "*_mapped.tsv.gz"
  - mapped_contigs_tsv_mqc:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*_mapped_mqc.tsv.gz":
          type: file
          description: |
            Optional gzipped copy of the mapped contigs TSV with a MultiQC custom-content
            front-matter header (id, section_name, pconfig.title) prepended so MultiQC
            picks it up as a distinct table. Only produced when at least one sequence
            passed the filtering thresholds.
          pattern: "*_mapped_mqc.tsv.gz"
  - versions:
      - "versions.yml":
          type: file
          description: YAML file with software versions used in this module.
          pattern: "versions.yml"
authors:
  - "@ochkalova"
  - "@jmattock5"
